<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot MVP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; display: flex; height: 100vh; }
        
        /* Sidebar - Admin Area */
        .sidebar { width: 320px; background: #ffffff; border-right: 1px solid #e0e0e0; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .sidebar h2 { font-size: 1.2rem; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .upload-box { border: 2px dashed #007bff; border-radius: 8px; padding: 20px; text-align: center; background: #f8f9fa; }
        .upload-box input { display: none; }
        .upload-btn { background: #007bff; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; display: inline-block; margin-top: 10px; }
        #upload-status { font-size: 0.85rem; color: #555; margin-top: 10px; word-break: break-word; }

        /* Main Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 20px; border-bottom: 1px solid #e0e0e0; background: #ffffff; }
        .chat-logs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 75%; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-msg { background: #f1f3f4; color: #333; align-self: flex-start; border-bottom-left-radius: 0; }
        .source-tag { margin-top: 8px; font-size: 0.75rem; color: #666; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; display: inline-block; }

        /* Input Bar */
        .input-box { padding: 15px 20px; border-top: 1px solid #e0e0e0; display: flex; gap: 10px; }
        .input-box input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .input-box button { background: #28a745; color: white; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Sidebar: Admin Upload -->
    <div class="sidebar">
        <h2>📂 Document Admin</h2>
        <div class="upload-box">
            <p style="font-size: 0.9rem;">PDF File select karke KB mein add karein</p>
            <label for="file-upload" class="upload-btn">Choose PDF</label>
            <input id="file-upload" type="file" accept=".pdf" onchange="uploadPDF()" />
            <div id="upload-status"></div>
        </div>
    </div>

    <!-- Main Chat UI -->
    <div class="chat-container">
        <div class="chat-header">
            <h3>🤖 Knowledge Base Assistant (RAG Chatbot)</h3>
        </div>

        <div class="chat-logs" id="chat-logs">
            <div class="message bot-msg">
                Hello! Main aapke uploaded documents se questions ka jawab de sakta hoon. Apne sawaalat yahan poohein!
            </div>
        </div>

        <div class="input-box">
            <input type="text" id="user-input" placeholder="Sawaal poohein... (e.g., Leave policy kya hai?)" onkeypress="if(event.key==='Enter') sendQuestion()" />
            <button onclick="sendQuestion()">Send</button>
        </div>
    </div>

    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('file-upload');
            const statusDiv = document.getElementById('upload-status');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            statusDiv.innerText = "Processing document...";
            statusDiv.style.color = "#007bff";

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    statusDiv.innerText = data.message;
                    statusDiv.style.color = "green";
                } else {
                    statusDiv.innerText = "Error: " + data.detail;
                    statusDiv.style.color = "red";
                }
            } catch (err) {
                statusDiv.innerText = "Upload failed.";
                statusDiv.style.color = "red";
            }
        }

        async function sendQuestion() {
            const inputField = document.getElementById('user-input');
            const question = inputField.value.trim();
            if (!question) return;

            const chatLogs = document.getElementById('chat-logs');

            // Append User Question
            chatLogs.innerHTML += `<div class="message user-msg">${question}</div>`;
            inputField.value = '';
            chatLogs.scrollTop = chatLogs.scrollHeight;

            // Append Loading Indicator
            const loadingId = 'loading-' + Date.now();
            chatLogs.innerHTML += `<div class="message bot-msg" id="${loadingId}">Searching documents...</div>`;
            chatLogs.scrollTop = chatLogs.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                const data = await res.json();
                const loadingElem = document.getElementById(loadingId);

                if (res.ok) {
                    let sourceHTML = '';
                    if (data.sources && data.sources.length > 0) {
                        sourceHTML = `<br/><div class="source-tag"><strong>Source:</strong> ${data.sources.join(', ')}</div>`;
                    }
                    loadingElem.innerHTML = `${data.answer} ${sourceHTML}`;
                } else {
                    loadingElem.innerText = "Error: " + data.detail;
                }
            } catch (err) {
                document.getElementById(loadingId).innerText = "Server Error. Please try again.";
            }
            chatLogs.scrollTop = chatLogs.scrollHeight;
        }
    </script>
</body>
</html>
